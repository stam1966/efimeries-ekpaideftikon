name: Build Windows (x64 + x86)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build ${{ matrix.arch }}
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --icon app_icon.ico --add-data "app_icon.ico;." --add-data "sv_ttk;sv_ttk"
          --hidden-import sv_ttk --add-data "Odigos_Chrisis_Efimeries.pdf;."
          --name EfimeriesPortable_${{ matrix.arch }} app.py
      - name: Add portable folders
        shell: pwsh
        run: |
          $d = "dist/EfimeriesPortable_${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$d/data/years","$d/exports","$d/backups" | Out-Null
          Copy-Item app_icon.ico, Odigos_Chrisis_Efimeries.pdf, create_shortcut.bat $d
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: dist/EfimeriesPortable_${{ matrix.arch }}

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: dist/EfimeriesPortable_x64
      - uses: actions/download-artifact@v4
        with:
          name: build-x86
          path: dist/EfimeriesPortable_x86
      - name: Assemble distribution
        shell: pwsh
        run: |
          $line = Select-String -Path app.py -Pattern '^APP_VERSION' | Select-Object -First 1
          $ver = ($line.Line -split '=')[1].Trim().Trim('"')
          $u = $ver.Replace('.', '_')
          "VER_U=$u" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $rel = "release/EfimeriesPortable_v$u"
          New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item dist/EfimeriesPortable_x64 "$rel/x64" -Recurse
          Copy-Item dist/EfimeriesPortable_x86 "$rel/x86" -Recurse
          New-Item -ItemType Directory -Force "$rel/Shared/data/years","$rel/Shared/backups","$rel/Shared/exports" | Out-Null
          Copy-Item Odigos_Chrisis_Efimeries.pdf "$rel/Odigos_Chrisis_Efimeries.pdf"
          Copy-Item DISTRIBUTION_README.txt "$rel/README.txt"
          Compress-Archive -Path "$rel/*" -DestinationPath "release/EfimeriesPortable_v${u}_Distribution.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: release/*.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
