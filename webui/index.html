<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Εφημερίες Εκπαιδευτικών</title>
<style>
:root{
  --bg:#f4f6f9;--panel:#fff;--panel2:#f8fafc;--line:#e3e8ef;--text:#1b2733;--muted:#66758a;
  --accent:#2563eb;--accent-d:#1d4ed8;--accent-soft:#e8efff;--ok:#16794a;--ok-soft:#e3f6ec;
  --warn:#9a5b00;--warn-soft:#fff3d9;--bad:#b3261e;--bad-soft:#fde8e6;--lock:#6b7280;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);--r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f141b;--panel:#171e28;--panel2:#1c2531;--line:#2a3544;--text:#e6edf5;--muted:#93a3b8;
  --accent:#5b8cff;--accent-d:#7aa2ff;--accent-soft:#1d2a47;--ok:#4ade80;--ok-soft:#14301f;
  --warn:#fbbf24;--warn-soft:#352a0c;--bad:#ff8a80;--bad-soft:#3a1714;--lock:#9aa7b8;--shadow:0 1px 2px #0006,0 4px 14px #0004}}
:root[data-theme=dark]{
  --bg:#0f141b;--panel:#171e28;--panel2:#1c2531;--line:#2a3544;--text:#e6edf5;--muted:#93a3b8;
  --accent:#5b8cff;--accent-d:#7aa2ff;--accent-soft:#1d2a47;--ok:#4ade80;--ok-soft:#14301f;
  --warn:#fbbf24;--warn-soft:#352a0c;--bad:#ff8a80;--bad-soft:#3a1714;--lock:#9aa7b8;--shadow:0 1px 2px #0006,0 4px 14px #0004}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{padding:4px 10px 16px}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand span{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--text);text-decoration:none;cursor:pointer;font-weight:500}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.nav a:hover{background:var(--panel2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a.on svg{opacity:1}
.side .foot{margin-top:auto;padding:10px;color:var(--muted);font-size:12px}
.main{overflow:auto;padding:26px 32px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px;letter-spacing:.1px}
.sub{color:var(--muted);margin:0 0 20px}
h2{font-size:15px;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--muted);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:550}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12.5px;font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);margin-bottom:10px}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert a{margin-left:auto;cursor:pointer;text-decoration:underline;white-space:nowrap}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--panel2)}
.item .t{font-weight:600}
.item .m{color:var(--muted);font-size:12.5px}
.day{position:sticky;top:-26px;background:var(--bg);padding:14px 2px 6px;font-weight:700;display:flex;gap:8px;align-items:baseline;z-index:2}
.day small{color:var(--muted);font-weight:500}
.today{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:550}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col h3{margin:0 0 8px;font-size:13px}
.col h3.today{color:var(--accent)}
.cell{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel2);border-radius:9px;padding:6px 8px;margin-bottom:7px;cursor:pointer}
.cell.locked{border-left-color:var(--lock)}
.cell.rep{border-left-color:#d97706}
.cell small{display:block;color:var(--muted)}
table{border-collapse:collapse;width:100%}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--panel2)}
.dots{display:inline-flex;gap:3px}
.dot{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.dot.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot.pri{background:var(--accent);color:#fff;border-color:transparent}
.dot.alt{background:var(--warn-soft);color:var(--warn);border-color:transparent}
button.dot{cursor:pointer}
.drawer-bg{position:fixed;inset:0;background:#0006;display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .18s ease;z-index:21;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.drawer header h2{margin:0;font-size:17px}
.drawer .body{padding:18px 20px;overflow:auto;flex:1}
.drawer footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;margin-left:auto}
.cand{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.cand.sel{border-color:var(--accent);background:var(--accent-soft)}
.cand.blocked{opacity:.5;cursor:not-allowed}
.cand input{pointer-events:none}
.cand .t{font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:40;max-width:80vw}
.step{display:flex;gap:12px;align-items:flex-start}
.num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:8px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block}
.opt span{color:var(--muted);font-size:13px}
.range{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.range input[type=range]{width:160px}
pre.out{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:340px;overflow:auto;font:13px/1.55 "Segoe UI",system-ui,sans-serif;margin:0}
.empty{color:var(--muted);padding:18px;text-align:center}
details>summary{cursor:pointer;font-weight:600;color:var(--muted)}
.hide{display:none!important}
.upd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--accent-soft);color:var(--accent);margin-bottom:14px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:180px;flex:1}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}.brand,.side .foot{display:none}.nav{flex-direction:row}.main{padding:18px 14px 60px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b id="bSchool">Εφημερίες</b><span id="bYear"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span id="bVer"></span></div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<div class="drawer-bg" id="bg"></div>
<aside class="drawer" id="drawer"><header><div><h2 id="dTitle"></h2><div class="m" id="dSub" style="color:var(--muted)"></div></div><button class="x" id="dClose" aria-label="Κλείσιμο">×</button></header><div class="body" id="dBody"></div><footer id="dFoot"></footer></aside>
<script>
"use strict";
const TOKEN="__TOKEN__";
const DAYS=["Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή"], D1=["Δ","Τ","Τ","Π","Π"];
const MONTHS=["Ιανουαρίου","Φεβρουαρίου","Μαρτίου","Απριλίου","Μαΐου","Ιουνίου","Ιουλίου","Αυγούστου","Σεπτεμβρίου","Οκτωβρίου","Νοεμβρίου","Δεκεμβρίου"];
const MONTHS_N=["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const MODES={daily:"Ανά ημέρα",breaks:"Ανά διάλειμμα",shifts:"Ανά βάρδια / ζώνη"};
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=s=>s?s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4):"";
const DAYS7=["Κυριακή","Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο"];
const longDate=s=>{const d=parse(s);return DAYS7[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]};
async function api(path,body,method){
  const opt={method:method||(body?"POST":"GET"),headers:{"X-Token":TOKEN}};
  if(body){opt.body=JSON.stringify(body);opt.headers["Content-Type"]="application/json"}
  let r;try{r=await fetch(path,opt)}catch(e){throw new Error("Η εφαρμογή δεν ανταποκρίνεται. Ελέγξτε ότι εκτελείται.")}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Σφάλμα "+r.status));return j}
const q=o=>Object.entries(o).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
function toast(msg,ms=4200){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=h("div",{class:"toast",role:"status"},msg);document.body.append(t);setTimeout(()=>t.remove(),ms)}
async function guard(fn,btn){try{if(btn)btn.disabled=true;return await fn()}catch(e){toast("⚠ "+e.message,6500)}finally{if(btn)btn.disabled=false}}
const ICON={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>',
 people:'<circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c.6-3.7 3.2-5.5 6.5-5.5s5.9 1.8 6.5 5.5"/><path d="M16 5.2a3.2 3.2 0 010 6M18 14.8c2 .6 3.2 2.3 3.5 5"/>',
 off:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
 gen:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
 print:'<path d="M7 9V3h10v6M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 14h10v7H7z"/>',
 more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/>'};
const PAGES=[["home","Αρχική","home"],["schedule","Πρόγραμμα","cal"],["teachers","Εκπαιδευτικοί","people"],["absences","Απουσίες","off"],["generate","Παραγωγή","gen"],["reports","Εκτυπώσεις","print"],["settings","Ρυθμίσεις","gear"]];
let S=null,cur="home";
const nav=$("#nav");
PAGES.forEach(([k,l,ic])=>nav.append(h("a",{id:"n-"+k,href:"#"+k,html:`<svg viewBox="0 0 24 24">${ICON[ic]}</svg>`},l)));
function go(k){location.hash="#"+k}
window.addEventListener("hashchange",route);
async function route(){
  cur=(location.hash||"#home").slice(1).split("/")[0];if(cur==="more")cur="settings";if(!PAGES.some(p=>p[0]===cur))cur="home";
  PAGES.forEach(p=>$("#n-"+p[0]).classList.toggle("on",p[0]===cur));
  closeDrawer();
  const v=$("#view");v.replaceChildren(h("div",{class:"empty"},"Φόρτωση…"));
  try{S=await api("/api/state");if(S.theme!==THEME){THEME=S.theme||"auto";applyTheme()}$("#bSchool").textContent=S.school;$("#bYear").textContent="Σχολικό έτος "+S.year;$("#bVer").textContent="v"+S.version+" · "+S.arch;
    v.replaceChildren();if(S.update)v.append(updBanner());await PAGE[cur](v)}catch(e){v.replaceChildren(h("div",{class:"alert bad"},"⚠ "+e.message))}
}
/* ---------------- Συρτάρι ---------------- */
function openDrawer(title,sub,body,foot){$("#dTitle").textContent=title;$("#dSub").textContent=sub||"";$("#dBody").replaceChildren(...[].concat(body));$("#dFoot").replaceChildren(...[].concat(foot||[]));$("#drawer").classList.add("open");$("#bg").style.display="block"}
function closeDrawer(){$("#drawer").classList.remove("open");$("#bg").style.display="none"}
$("#bg").onclick=closeDrawer;$("#dClose").onclick=closeDrawer;
addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
/* ---------------- Ενημερώσεις ---------------- */
function updBanner(){
  const u=S.update,box=h("div",{class:"upd"}),txt=h("span",{},"Διαθέσιμη νέα έκδοση "+u.tag+" (έχετε την v"+S.version+")");box.append(txt);
  const bar=h("div",{class:"bar hide"},h("i")),info=h("small",{class:"hide"});
  const notes=h("button",{class:"btn sm",onclick:()=>openDrawer("Τι νέο υπάρχει στην "+u.tag,"Τα δεδομένα σας δεν επηρεάζονται.",h("pre",{class:"out"},u.notes||"Δεν υπάρχουν σημειώσεις έκδοσης."),h("button",{class:"btn",onclick:closeDrawer},"Κλείσιμο"))},"Τι νέο υπάρχει");
  const inst=h("button",{class:"btn pri sm",onclick:()=>guard(async()=>{
    if(!u.can_install){window.open(u.url,"_blank");return}
    if(!confirm("Η εφαρμογή θα κλείσει για να εγκατασταθεί η "+u.tag+" και θα ανοίξει ξανά μόνη της. Τα δεδομένα σας δεν επηρεάζονται. Να συνεχίσω;"))return;
    await api("/api/update/install",{});[inst,notes,later].forEach(x=>x.classList.add("hide"));bar.classList.remove("hide");info.classList.remove("hide");txt.textContent="Λήψη της "+u.tag+"…";
    for(;;){await new Promise(r=>setTimeout(r,450));const s=await api("/api/update/status");
      if(s.total){bar.firstChild.style.width=(100*s.done/s.total)+"%";info.textContent=(s.done/1048576).toFixed(1)+" / "+(s.total/1048576).toFixed(1)+" MB"}
      if(s.state==="error")throw new Error("Η λήψη απέτυχε. Δοκιμάστε ξανά αργότερα.");
      if(s.state==="ready"){await api("/api/update/launch",{});document.body.innerHTML='<div style="padding:60px;text-align:center;font:16px system-ui">Γίνεται εγκατάσταση της νέας έκδοσης…<br>Η εφαρμογή θα ανοίξει ξανά σε λίγα δευτερόλεπτα. Μπορείτε να κλείσετε αυτό το παράθυρο.</div>';return}}
  },inst)},u.can_install?"Λήψη και εγκατάσταση τώρα":"Άνοιγμα σελίδας λήψης");
  const later=h("button",{class:"btn sm",onclick:()=>box.remove()},"Αργότερα");
  const skip=h("button",{class:"btn sm",onclick:()=>guard(async()=>{await api("/api/update/skip",{});box.remove()})},"Όχι για αυτή την έκδοση");
  box.append(bar,info,inst,notes,later,skip);return box}
/* ---------------- Αρχική ---------------- */
const PAGE={};
PAGE.home=async v=>{
  const todayRows=S.upcoming.filter(r=>r.d===S.today);
  v.append(h("h1",{},"Καλώς ήρθατε"),h("p",{class:"sub"},longDate(S.today)+" · "+S.school));
  S.attention.forEach(a=>v.append(h("div",{class:"alert"},"⚠ "+a.text,h("a",{onclick:()=>go(a.go)},"Άνοιγμα →"))));
  if(!S.attention.length&&S.assignments>0)v.append(h("div",{class:"alert ok"},"✔ Όλα εντάξει: δεν υπάρχουν σημεία που χρειάζονται προσοχή."));
